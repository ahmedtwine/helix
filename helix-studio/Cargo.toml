[package]
name = "helix-studio"
description = "IDE-style UI layer for Helix"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "hx"
path = "src/main.rs"

[dependencies]
helix-core = { path = "../helix-core" }
helix-view = { path = "../helix-view" }
helix-term = { path = "../helix-term" }
helix-loader = { path = "../helix-loader" }
helix-stdx = { path = "../helix-stdx" }
helix-event = { path = "../helix-event" }
helix-vcs = { path = "../helix-vcs" }
helix-lsp = { path = "../helix-lsp" }
tui = { path = "../helix-tui", package = "helix-tui", default-features = false, features = ["termina", "crossterm"] }

anyhow = "1"
toml.workspace = true
serde = { version = "1", features = ["derive"] }
ignore = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
tempfile.workspace = true
